# ChainTest reads classpath properties first, then matching environment variables,
# and finally Maven/Java system properties. For CI overrides use -Dchaintest.*=value.
chaintest.project.name=Salesforce-UI-Automation


# Built-in static HTML generator. It is registered dynamically from these settings.
chaintest.generator.simple.enabled=true
chaintest.generator.simple.class-name=com.aventstack.chaintest.generator.ChainTestSimpleGenerator
chaintest.generator.simple.output-file=target/chaintest/index.html
chaintest.generator.simple.document-title=Salesforce Automation Report
chaintest.generator.simple.datetime-format=yyyy-MM-dd HH:mm:ss
chaintest.generator.simple.dark-theme=false

# true bundles CSS/JS/fonts, so the HTML report remains portable when archived in CI.
chaintest.generator.simple.offline=true

# Optional custom assets. Keep non-null (blank) values because ChainTest renders them into the report template.
chaintest.generator.simple.js=
chaintest.generator.simple.css=
